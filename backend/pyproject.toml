[project]
name = "study-abroad-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the Study Abroad Assistant MVP."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "docling>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "pgvector>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
