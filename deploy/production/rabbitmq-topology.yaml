apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata: {name: study-agent-commands, namespace: study-assistant}
spec:
  name: study.agent.commands.v1
  vhost: study-production
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: study-rabbitmq}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata: {name: study-agent-events, namespace: study-assistant}
spec:
  name: study.agent.events.v1
  vhost: study-production
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: study-rabbitmq}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata: {name: study-agent-dlx, namespace: study-assistant}
spec:
  name: study.agent.dlx.v1
  vhost: study-production
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: study-rabbitmq}
---
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata: {name: study-dead-lettering, namespace: study-assistant}
spec:
  name: study-dead-lettering
  vhost: study-production
  pattern: "^study\\.(workflow|assignment|travel|finance|fitness|planner|email|notice|social|wellbeing|orchestrator)\\..*\\.q$"
  applyTo: queues
  definition:
    dead-letter-exchange: study.agent.dlx.v1
    delivery-limit: 4
  priority: 10
  rabbitmqClusterReference: {name: study-rabbitmq}
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata: {name: study-workflow-prepare-q, namespace: study-assistant}
spec:
  name: study.workflow.prepare.q
  vhost: study-production
  durable: true
  arguments: {x-queue-type: quorum, x-single-active-consumer: true}
  rabbitmqClusterReference: {name: study-rabbitmq}
---
