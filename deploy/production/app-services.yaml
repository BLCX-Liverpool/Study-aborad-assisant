apiVersion: apps/v1
kind: Deployment
metadata: {name: study-assignment-worker, namespace: study-assistant}
spec:
  replicas: 1
  selector: {matchLabels: {app: study-assignment-worker}}
  template:
    metadata: {labels: {app: study-assignment-worker}}
    spec:
      containers:
        - name: worker
          image: registry.example/study-assistant:RELEASE
          args: ["python", "-m", "app.workers.main", "--queue", "study.assignment.q"]
          envFrom: [{secretRef: {name: study-runtime-secrets}}]
          env:
            - {name: APP_ENV, value: production}
            - {name: RABBITMQ_VHOST, value: study-production}
            - {name: RABBITMQ_DECLARE_TOPOLOGY, value: "false"}
            - {name: RABBITMQ_WORKFLOW_ENABLED, value: "true"}
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: study-runtime-secrets, key: rabbitmq_worker_url}}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "4", memory: 4Gi}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: study-assignment-worker, namespace: study-assistant}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: study-assignment-worker}
  minReplicas: 1
  maxReplicas: 8
  behavior: {scaleDown: {stabilizationWindowSeconds: 600}}
  metrics:
    - type: External
      external:
        metric: {name: rabbitmq_queue_messages_ready, selector: {matchLabels: {queue: study.assignment.q}}}
        target: {type: AverageValue, averageValue: "2"}
